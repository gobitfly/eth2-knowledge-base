  # mid priority
  /v2/ethereum/queue:
    post:
      tags:
        - Network
      summary: ✅ Staking Queues
      operationId: GetQueueStats
      x-mint:
        href: "/api-reference/ethereum/queue"
      description: Returns information about the various staking related queues (e.g. activation, exit, etc) and how long the expected wait time is.
      requestBody:
        $ref : "#/components/requestBodies/JustChain"
      responses:
        "200":
          $ref: '#/components/responses/QueueStats'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
        "429":
          $ref: '#/components/responses/RateLimitExceeded'
        default:
          $ref: '#/components/responses/DefaultError'

