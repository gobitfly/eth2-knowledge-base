          $ref: '#/components/schemas/Epoch'
        end:
          $ref: '#/components/schemas/Epoch'

    TimeRange:
      type: object
      properties:
        start:
          $ref: '#/components/schemas/timestamp'
        end:
          $ref: '#/components/schemas/timestamp'

