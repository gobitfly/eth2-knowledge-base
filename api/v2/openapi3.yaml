openapi: 3.0.4
info:
  title: External Service API
  version: 1.0.3

servers:
  - url: http://beaconcha.in/api
    description: Production API

security:
  - ApiKeyAuth: []
  - GCPAuth: []
  
paths:
  /v2/ethereum/validators: # low prio
    post:
      tags:
        - Validator
      summary: ✅ Overview
      operationId: GetValidatorOverview
      x-mint:
        href: "/api-reference/ethereum/validators"
      description: |
        Returns basic information about a set of validators at the current epoch. 

        Data returned by the endpoint is based on the latest completed epoch of the beacon chain (not finalized).
      requestBody:
        $ref: "#/components/requestBodies/validatorChainCursorPageSize"
      responses:
        "200":     
          $ref: '#/components/responses/ValidatorOverview'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
        "429":
          $ref: '#/components/responses/RateLimitExceeded'
        default:
          $ref: '#/components/responses/DefaultError'

  /v2/ethereum/validators/sync-committees: # low prio
    post:
      operationId: GetValidatorSyncCommittees
      x-mint:
        href: "/api-reference/ethereum/validators/sync-committees"
      tags:
        - Validator Aggregate
      summary: 👀 Sync Committee
      description: | 
        Returns the sync committee periods in which a set of validators have participated or are scheduled to participate within a specified time range.
      requestBody:
         $ref : "#/components/requestBodies/aggregateValidatorChainStartEnd"
      responses:
        "200":
          $ref: '#/components/responses/ValidatorSyncCommittees'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
        "429":
          $ref: '#/components/responses/RateLimitExceeded'
        default:
          $ref: '#/components/responses/DefaultError'

  /v2/ethereum/validators/apy-roi: # highest prio!
    post:
      tags:
        - Validator Aggregate
      summary: 👀 APY & ROI
      operationId: GetValidatorApyRoi
      x-mint:
        href: "/api-reference/ethereum/validators/apy-roi"
      description: |
        Returns the annual percentage yield (APY) and return on investment (ROI) for a pre-computed set of validators.

        For comparing performance across different staking providers, we recommend using the BeaconScore from the performance-summary endpoints instead of APY or ROI, as BeaconScore normalizes for luck and provides a fairer comparison.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                chain:
                  $ref: '#/components/schemas/Chain'
                validator:
                    $ref: '#/components/schemas/validatorSelector'
                evaluation_window:
                  description: |
                    The time period over which to evaluate the APY and ROI. 
                    If not provided, defaults to the last 30 days.
                  $ref: '#/components/schemas/EvaluationWindow'
              required:
                - validator

      responses:
        "200":
          $ref: '#/components/responses/ValidatorApyRoi'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
        "429":
          $ref: '#/components/responses/RateLimitExceeded'
        default:
          $ref: '#/components/responses/DefaultError'

  /v2/ethereum/validators/rewards-summary: # highest prio!
    post:
      tags:
        - Validator Aggregate
      operationId: GetValidatorRewardsSummary
      x-mint:
        href: "/api-reference/ethereum/validators/rewards-summary"
      summary: Rewards Summary
      description: |
        Returns the cumulative rewards for a set for a pre-computed set of validators.
        
         A pre-computed set is a deposit address, a withdrawal address or a single validator index or public key. 
         
         Must provide either start + end times or epochs. Must provide one of deposit_address, withdrawal_address or validator.
      requestBody:
        $ref : "#/components/requestBodies/aggregateValidatorChainStartEnd"
      responses:
        "200":
          $ref: '#/components/responses/ValidatorRewardsSummary'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
        "429":
          $ref: '#/components/responses/RateLimitExceeded'
        default:
          $ref: '#/components/responses/DefaultError'

  /v2/ethereum/validators/rewards-detailed: # highest prio!
    post:
      tags:
        - Validator
      operationId: GetValidatorRewardsDetailed
      x-mint:
        href: "/api-reference/ethereum/validators/rewards-detailed"
      summary: Rewards Detailed
      description: Returns a detailed description of a validator's rewards for a specific epoch for a set of validators
      requestBody:
        $ref : "#/components/requestBodies/validatorChainCursorPageSizeEpoch"
      responses:
        "200":
          $ref: '#/components/responses/ValidatorRewardsDetailed'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
        "429":
          $ref: '#/components/responses/RateLimitExceeded'
        default:
          $ref: '#/components/responses/DefaultError'

  /v2/ethereum/validators/performance-summary: # highest prio!
    post:
      tags:
        - Validator Aggregate
      summary: ✅ Performance Summary
      x-mint:
        href: "/api-reference/ethereum/validators/performance-summary"
      operationId: GetValidatorPerformanceSummary
      description: |
        Returns the performance summary for a pre-computed set of validators. 
      requestBody:
        $ref : "#/components/requestBodies/aggregateValidatorChainStartEnd"
      responses:
        "200":
          $ref: '#/components/responses/ValidatorPerformanceSummary'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
        "429":
          $ref: '#/components/responses/RateLimitExceeded'
        default:
          $ref: '#/components/responses/DefaultError'

  /v2/ethereum/validators/upcoming-duties: # highest prio!
    post:
      tags:
        - Validator Aggregate
      summary: Upcoming Slot Duties
      x-mint:
        href: "/api-reference/ethereum/validators/upcoming-duties"
      operationId: GetValidatorUpcomingDuties
      description: |
        !! About to become obsolete. !!
        Returns the upcoming duty slots for a pre-computed set of validators.

          Currently, this endpoint returns only sync committee duties. 
          Future releases will include proposer and attester duties as well.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                chain:
                  $ref: '#/components/schemas/Chain'
                validator:
                    $ref: '#/components/schemas/validatorSelector'
      responses:
        "200":
          $ref: '#/components/responses/ValidatorUpcomingDuties'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
        "429":
          $ref: '#/components/responses/RateLimitExceeded'
        default:
          $ref: '#/components/responses/DefaultError'

  /v2/ethereum/validators/performance-detailed: # highest prio!
    post:
      tags:
        - Validator
      summary: 👀 Performance Detailed
      x-mint:
        href: "/api-reference/ethereum/validators/performance-detailed"
      operationId: GetValidatorPerformanceDetailed
      description: Returns a detailed description of a validator's performance for a specific epoch for a set of validators
      requestBody:
         $ref : "#/components/requestBodies/validatorChainCursorPageSizeEpoch"
      responses:
        "200":
          $ref: '#/components/responses/ValidatorPerformanceDetailed'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
        "429":
          $ref: '#/components/responses/RateLimitExceeded'
        default:
          $ref: '#/components/responses/DefaultError'

  /v2/ethereum/validators/balances: # low prio
    post:
      tags:
        - Validator
      summary: ✅ Balances
      operationId: GetValidatorBalances
      x-mint:
        href: "/api-reference/ethereum/validators/balances"
      description: Returns the balances for a set of validators at a particular epoch
      requestBody:
         $ref : "#/components/requestBodies/validatorChainCursorPageSizeEpoch"
      responses:
        "200":
          $ref: '#/components/responses/ValidatorBalances'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
        "429":
          $ref: '#/components/responses/RateLimitExceeded'
        default:
          $ref: '#/components/responses/DefaultError'

  /v2/ethereum/validators/proposals: # low prio
    post:
      tags:
        - Validator
      summary: Proposals
      x-mint:
        href: "/api-reference/ethereum/validators/proposals"
      description: Returns proposal information for a set of validators
      requestBody:
        $ref: "#/components/requestBodies/validatorChainCursorPageSizeEpochNullable"
      responses:
        "200":
          $ref: '#/components/responses/ValidatorProposals'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
        "429":
          $ref: '#/components/responses/RateLimitExceeded'
        default:
          $ref: '#/components/responses/DefaultError'

  /v2/ethereum/validators/attestations: # low prio
    post:
      tags:
        - Validator
      summary: Attestations
      x-mint:
        href: "/api-reference/ethereum/validators/attestations"
      description: Returns attestation information for a set of validators at a particular epoch
      requestBody:
         $ref : "#/components/requestBodies/validatorChainCursorPageSizeEpoch"
      responses:
        "200":
          $ref: '#/components/responses/ValidatorAttestations'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
        "429":
          $ref: '#/components/responses/RateLimitExceeded'
        default:
          $ref: '#/components/responses/DefaultError'



  /v2/ethereum/validators/deposits: # mid priority
    post:
      tags:
        - Validator
      summary: Deposits
      x-mint:
        href: "/api-reference/ethereum/validators/deposits"
      description: Returns the deposits for a set of validators
      requestBody:
         $ref : "#/components/requestBodies/validatorChainCursorPageSizeEpochNullable"
      responses:
        "200":
          $ref: '#/components/responses/ValidatorDeposits'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
        "429":
          $ref: '#/components/responses/RateLimitExceeded'
        default:
          $ref: '#/components/responses/DefaultError'

  /v2/ethereum/validators/withdrawals: # mid priority
    post:
      tags:
        - Validator
      summary: Withdrawals
      x-mint:
        href: "/api-reference/ethereum/validators/withdrawals"
      description: Returns the withdrawals for a set of validators
      requestBody:
        $ref : "#/components/requestBodies/validatorChainCursorPageSizeEpochNullable"
      responses:
        "200":
          $ref: '#/components/responses/ValidatorWithdrawals'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
        "429":
          $ref: '#/components/responses/RateLimitExceeded'
        default:
          $ref: '#/components/responses/DefaultError'

  /v2/ethereum/validators/queue:
    post:
      tags:
        - Validator
      summary: 👀 Staking Queues
      x-mint:
        href: "/api-reference/ethereum/validators/queue"
      operationId: GetValidatorQueueStats
      description: Provides detailed information about staking-related queues (such as activation, exit, and withdrawal) and the estimated wait times specifically for the selected set of validators.
      requestBody:
        $ref : "#/components/requestBodies/validatorChainCursorPageSize"
      responses:
        "200":
          $ref: '#/components/responses/ValidatorQueueStats'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
        "429":
          $ref: '#/components/responses/RateLimitExceeded'
        default:
          $ref: '#/components/responses/DefaultError'


  /v2/ethereum/slot/{slot}:
    post:
      operationId: GetSlot
      tags:
        - Slot
      summary: 👀 Overview
      x-mint:
        href: "/api-reference/ethereum/slot/overview"
      description: |
        Provides a basic overview about a specific slot. 

        Query by slot number, block root hash or "latest" / "finalized".
      parameters:
        - $ref: '#/components/parameters/slot'
      requestBody:
        $ref : "#/components/requestBodies/JustChain"
      responses:
        "200":
          $ref: '#/components/responses/SlotOverview'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
        "429":
          $ref: '#/components/responses/RateLimitExceeded'
        default:
          $ref: '#/components/responses/DefaultError'
  
  
  /v2/ethereum/slot/{slot}/sync-committee-duties: # mid priority
    post:
      operationId: GetSyncCommitteeDutiesForSlot
      tags:
        - Slot
      summary: 👀 Sync Committee Duties
      x-mint:
        href: "/api-reference/ethereum/slot/sync-committee-duties"
      description: |
        Provides status information about sync committee duties for a specific slot for each validator. 
        The validator filter is optional; if omitted, results include all validators assigned sync duties for the slot.
      parameters:
        - $ref: '#/components/parameters/slot'
      requestBody:
        $ref : "#/components/requestBodies/optionalValidatorChainCursorPageSize"
      responses:
        "200":
          $ref: '#/components/responses/SlotSyncCommittee'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
        "429":
          $ref: '#/components/responses/RateLimitExceeded'
        default:
          $ref: '#/components/responses/DefaultError'
  

