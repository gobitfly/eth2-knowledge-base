    EstimatedWithEpoch:
      type: object
      properties:
        epoch:
          $ref: '#/components/schemas/Epoch'
          description: Epoch number
        timestamp:
          $ref: '#/components/schemas/timestamp'
          description: Unix timestamp

    ValidatorQueueStats.Data:
      type: object
      properties:
        validator:
          $ref: '#/components/schemas/validator'

        deposit:
          type: object
          nullable: true
          properties:
            next:
              $ref: '#/components/schemas/PendingAction'
              description: Details for the next in line pending deposit/top-up.
            all:
              $ref: '#/components/schemas/PendingActionAll'
              description: Details for all pending deposits/top-ups combined.
            estimated_activation:
              $ref: '#/components/schemas/EstimatedWithEpoch'
              description: |
                Estimated time and epoch when a newly deposited validator will become active.
                Null for top-ups, or if balance+pending deposits < 32 ETH.
              nullable: true

        exit:
          type: object
          nullable: true
          properties:
            estimated_exit:
              $ref: '#/components/schemas/EstimatedWithEpoch'
              description: |
                Estimated time/epoch when the validator will exit the active set.
            estimated_last_duty:
              $ref: '#/components/schemas/EstimatedWithEpoch'
              description: |
                Estimated time/epoch of the validator's last duty.
                Usually aligns with `estimated_exit`, but rare sync-committee assignments may happen afterward.
            estimated_eligible_withdrawal:
              $ref: '#/components/schemas/EstimatedWithEpoch'
              description: |
                Estimated epoch and timestamp when the validator becomes eligible for withdrawal
                (at least 256 epochs after exit).

                Eligibility marks the earliest point at which the validator can be withdrawn.
                The actual withdrawal may, in the worst case, occur up to ~10 days later due to the automatic sweeping process (sweep delay). 
                For the estimated time when the balance will actually be withdrawn, see `estimated_withdrawal` below.
            estimated_withdrawal:
              $ref: '#/components/schemas/EstimatedWithEpoch'
              description: |
                Estimated epoch when the validator’s balance will actually be withdrawn.
                Accounts for the sweep delay after eligibility.

        withdrawal:
          type: object
          nullable: true
          description: |
            Information about the validator's automatic and manual withdrawals.

            Withdrawals can be automatic (auto-sweep) or manual (initiated by the validator owner).
            A validator may have either, both, or neither type of pending withdrawals.
          properties:
            withdrawal_sweep:
              type: object
              nullable: true
              description: |
                Automatic withdrawals occur periodically for exited validators or when balance exceeds the maximum effective balance.

                Will be null for validators that are not eligible for auto-sweeps at the moment.
              properties:
                next:
                  type: object
                  description: Details of the next in line scheduled automatic withdrawal (sweep/skimming).
                  nullable: true
                  properties:
                    estimated_amount:
                      $ref: '#/components/schemas/wei'
                      description: Estimated withdrawal amount in the next sweep.
                    estimated_withdrawal:
                      $ref: '#/components/schemas/EstimatedWithEpoch'
                      description: Estimated epoch when next sweep occurs.
        finality:
          $ref: '#/components/schemas/FinalityParamsOnlyNoFinalization'
            # manual_withdrawal:
            #   type: object
            #   nullable: true
            #   properties:
            #     next:
            #       $ref: '#/components/schemas/PendingAction'
            #       description: Details of the next pending manual withdrawal.
            #     all:
            #       $ref: '#/components/schemas/PendingActionAll'
            #       description: Aggregated details of all pending manual withdrawals.

    PendingAction:
      type: object
      nullable: true
      properties:
        amount:
          $ref: '#/components/schemas/wei'
          description: Amount of the next pending action in wei.
        estimated_processed:
          $ref: '#/components/schemas/EstimatedWithEpoch'
          description: Estimated epoch when this action will be processed.

    PendingActionAll:
      type: object
      nullable: true
      properties:
        amount:
          $ref: '#/components/schemas/wei'
          description: Total amount of all pending actions in wei.
        estimated_processed:
          $ref: '#/components/schemas/EstimatedWithEpoch'
          description: Estimated epoch when all actions will be processed.


                
       # - $ref: '#/components/schemas/QueueStats.Data'
     

    QueueStats.Data:
      type: object
      properties:
        deposit_queue:
          type : object
          properties:
            deposit_count:
              $ref: '#/components/schemas/count'
              description: |
                Total number of deposits currently in the queue, including both new validator deposits and top-ups.
                Note: A single validator may have multiple pending deposits (top-ups) in the queue; this value counts all deposits without deduplication by validator.
              nullable: true
            balance:
              $ref: '#/components/schemas/wei'
              description: Total balance of deposits in the queue
              nullable: true
            estimated_processed_at:
              $ref: '#/components/schemas/timestamp'
              description: Estimated unix timestamp when the last deposit in the queue will be processed
              nullable: true
            churn:
              description: Current churn limit in wei, i.e. how much balance can be processed per epoch.
              $ref: '#/components/schemas/wei'
        exit_queue:
          $ref: '#/components/schemas/QueueDetail'
        withdrawal_sweep:
          type: object
          properties:
            estimated_sweep_delay:
              $ref: '#/components/schemas/timestamp'
              description: |
                Estimated maximum time, in seconds, before a newly submitted and valid withdrawal is processed.

                Note: Withdrawals are handled using a rotational (clock hand) mechanism rather than a traditional queue.
                As a result, your withdrawal may be processed sooner than this estimate, depending on its position relative to the current location of the processing clock hand.

                This value reflects the duration required for the clock hand to complete a full rotation.
              nullable: true
            last_swept_validator_index:
              description: |
                The index of the last validator for which an automatic withdrawal was processed.
                
                This can be used to determine the current position of the withdrawal processing clock hand.
              type: integer

        # TODO: other queues
        finality:
          $ref: '#/components/schemas/FinalityParams'

    Slashings.Data:
      type: object
      properties:
        slashed_validator:
          $ref: '#/components/schemas/validator'
        slashing_validator:
          $ref: '#/components/schemas/validator'
        violation:
          $ref: '#/components/schemas/Slashings.Violation'
        slot:
          $ref: '#/components/schemas/Slot'

    Slashings.Violation:
      type: string
      enum:
        - multiple_attestations_checkpoints
        - surrounding_attestation
        - multiple_blocks
        - multiple_attestations_head

    clEventDetails:
      type: object
      properties:
        count:
          type: integer
          minimum: 0
        amount:
          $ref: '#/components/schemas/wei'

    SlotOverview.Data:
      type: object
      properties:
        slot:
          $ref: '#/components/schemas/Slot'
        epoch:
          $ref: '#/components/schemas/Epoch'
        block:
          $ref: '#/components/schemas/Block'
        sync_committee_period:
          $ref: '#/components/schemas/SyncCommitteePeriod'
        timestamp:
          $ref: '#/components/schemas/timestamp'
        proposer:
          $ref: '#/components/schemas/validator'
        status:
          $ref: '#/components/schemas/DutyStatus'
        block_root:
          $ref: '#/components/schemas/ConsensusLayerBlockRoot'
        attestation_count:
          type: integer
          nullable: true
        included_slashing_count:
          type: object
          description: |
            Statistics about slashing proofs included in this slot.
            A slashing proof provides cryptographic evidence that one or more validators have committed a slashable offense, such as:
              - double voting (submitting two conflicting attestations or proposals for the same target epoch)
              - surround voting (submitting two attestations or proposals where one surrounds the other in terms of source and target epochs)
          properties:
            proposer:
              description: |
                Number of slashing proofs included in this slot where a previous block proposer committed a slashable offense.
              $ref: '#/components/schemas/validatorIndex'
              nullable: true
            attestation:
              description: |
                Number of slashing proofs included in this slot where a previous attester committed a slashable offense.
              $ref: '#/components/schemas/validatorIndex'
              nullable: true
        sync_participation:
          type: object
          description: |
            Statistics showing sync committee participation for this slot.

            Note: This represents participation by validators assigned to the sync committee for this period.
          properties:
            total:
              type: integer
              nullable: true
            participated:
              type: integer
              nullable: true
            participation_rate:
              type: number
              format: float
              nullable: true
        vote_participation:
          type: object
          description: |
            Statistics showing attestation vote participation for this slot.

            Note: This represents participation by validators assigned attestation duties for this slot.
          properties:
            total:
              type: integer
              nullable: true
            participated:
              type: integer
              nullable: true
            participation_rate:
              type: number
              format: float
              nullable: true
        included_blob_commitment_count:
          type: integer
          nullable: true
          description: |
            The count of data blobs commitments (kzg commitments) included in this slot, if present.

            Data blobs are introduced by EIP-4844 (Proto-Danksharding) as part of the data availability layer in the Pectra hardfork.
            This field is null for slots prior to the hardfork activation.
        queue_events:
          type: object
          properties:
            queued:
              type: object
              description: |
                Statistics about consensus layer events that were added to the queue in this slot.
              properties:
                deposit:
                  $ref: '#/components/schemas/clEventDetails'
                withdrawal_manual:
                  $ref: '#/components/schemas/clEventDetails'
                consolidation:
                  $ref: '#/components/schemas/clEventDetails'
                exits:
                  $ref: '#/components/schemas/clEventDetails'
            processed:
              type: object
              description: |
                Statistics about consensus layer events that were processed from the queue in this slot.
              properties:
                deposit:
                  $ref: '#/components/schemas/clEventDetails'
                withdrawal_sweep:
                  $ref: '#/components/schemas/clEventDetails'
                withdrawal_manual:
                  $ref: '#/components/schemas/clEventDetails'
                consolidation:
                  $ref: '#/components/schemas/clEventDetails'
                exits:
                  $ref: '#/components/schemas/clEventDetails'
        graffiti:
          $ref: "#/components/schemas/graffiti"
        finality:
          $ref: '#/components/schemas/FinalityParams'

    SyncCommitteeOverview.Data:
      type: object
      properties:
        period:
          $ref: '#/components/schemas/SyncCommitteePeriod'
        range:
          $ref : '#/components/schemas/ResultRange'
        finality:
          $ref: '#/components/schemas/FinalityParams'

    ValidatorSyncCommittees.Data:
      type: object
      properties:
        sync_committee_period:
          $ref: '#/components/schemas/SyncCommitteePeriod'
        finality:
          $ref: '#/components/schemas/FinalityParams'
      
    SyncCommitteeValidators.Data:
      type: object
      properties:
        validators:
          type: array
          items:
            type: object
            properties:
              validator:
                $ref: '#/components/schemas/validator'
              duties:
                nullable: true
                description: |
                  Sync committee duties assigned to the validator in the specified period.
                  Null if the sync committee period is in the future.
                $ref: '#/components/schemas/ValidatorSyncCommitteeDutyCount'
              
    RoiApyMetrics:
      type: object
      properties:
        roi:
          type: object
          description: Raw performance in the evaluation window (not annualized).
          properties:
            total:
              type: number
              format: float
              example: 0.15
              description: >
                ROI including total rewards and penalties on the execution layer, calculated only over the evaluation window.
            missed:
              type: number
              format: float
              maximum: 0
              example: -0.02
              description: >
                ROI penalty from missed execution layer proposals. Estimated as the missed reward compared to the average
                block reward in each individual epoch of the evaluation window.
        apy:
          type: object
          description: Annualized performance extrapolated from the evaluation window.
          properties:
            total:
              type: number
              format: float
              example: 2.76
              description: >
                Annual Percentage Yield (APY) including total rewards and penalties on the consensus layer.
            missed:
              type: number
              format: float
              maximum: 0
              example: -0.5
              description: >
                Negative APY impact from missed consensus duties, annualized to approximate yearly effect.
    ValidatorApyRoi.Data:
      type: object
      description: >
        Validator performance metrics, expressed both as ROI (Return on Investment) and APY (Annual Percentage Yield).

          - ROI represents the actual return over the selected evaluation window, not annualized.
          - APY is the same return but annualized to show the equivalent yearly rate.

        ROI helps understand raw performance during the evaluation range, while APY allows comparison against annualized benchmarks.

        Note that APY is an extrapolation and does not reflect future performance.
      properties:
        execution_layer:
          $ref: '#/components/schemas/RoiApyMetrics'
          description: Performance from execution layer activities (block proposals, MEV, transaction fees).
