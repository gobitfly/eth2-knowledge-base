  /v2/ethereum/performance-summary: # highest prio!
    post:
      tags:
        - Network
      summary: 👀 Performance Summary
      x-mint:
        href: "/api-reference/ethereum/performance-summary"
      operationId: GetPerformanceSummary
      description: |
        Returns performance metrics for the entire network in the given time range.

        Must provide either start + end times or epochs
      requestBody:
        $ref : "#/components/requestBodies/aggregateChainStartEnd"
      responses:
        "200":
          $ref: '#/components/responses/PerformanceSummary'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
        "429":
          $ref: '#/components/responses/RateLimitExceeded'
        default:
          $ref: '#/components/responses/DefaultError'

