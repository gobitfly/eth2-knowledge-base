  requestBodies:
    JustChain:
      content:
        application/json:
          schema:
            type: object
            properties:
              chain:
                $ref: '#/components/schemas/Chain'

    aggregateChainStartEnd:
      content:
        application/json:
          schema:
            type: object
            properties:
              chain:
                $ref: '#/components/schemas/Chain'
              range:
                $ref: '#/components/schemas/timeRangeSelector'
            required:
              - range

    aggregateValidatorChainStartEnd:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AggregateValidatorChainStartEnd'

    validatorChainCursorPageSize:
      content:
        application/json:
          schema:
             allOf:
              - $ref: '#/components/schemas/ValidatorChainCursorPageSizeBase'
              - type: object
                required: [validator]


    ChainOptionalValidator:
      description: "`validator` is optional in this request body"
      content:
        application/json:
          schema:
            type: object
            properties:
              chain:
                $ref: '#/components/schemas/Chain'
              validator:
                $ref: '#/components/schemas/validatorsSelector'

    optionalValidatorChainCursorPageSize:
      description: "`validator` is optional in this request body"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidatorChainCursorPageSizeBase'


    validatorChainCursorPageSizeEpoch:
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ValidatorChainCursorPageSizeBase'
              - type: object
                properties:
                  epoch:
                    $ref: '#/components/schemas/epochParam'
                required:
                  - epoch
                  - validator

    validatorChainCursorPageSizeEpochNullable:
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ValidatorChainCursorPageSizeBase'
              - type: object
                properties:
                  epoch:
                    $ref: '#/components/schemas/epochParamNullable'
                required:
                  - validator

  schemas:
    
    PagingRangeTemplate:
      type: object
      properties:
        paging:
          $ref: '#/components/schemas/Paging'
        range:
          $ref: '#/components/schemas/ResultRange'

    PagingTemplate:
      type: object
      properties:
        paging:
          $ref: '#/components/schemas/Paging'

    ValidatorChainCursorPageSizeBase:
      type: object
      properties:
        chain:
          $ref: '#/components/schemas/Chain'
        cursor:
          $ref: '#/components/schemas/Cursor'
        page_size:
          $ref: '#/components/schemas/PageSize'
        validator:
          $ref: '#/components/schemas/validatorsSelector'

    
    AggregateValidatorChainStartEnd:
      type: object
      properties:
        chain:
          $ref: '#/components/schemas/Chain'
        validator:
          $ref: '#/components/schemas/validatorSelector'
        range:
          $ref: '#/components/schemas/timeRangeSelector'
      required:
        - validator
        - range

    timeRangeSelectorTime:
      type: object
      title: Unix Timestamp
      description: Unix timestamp
      properties:
        timestamp:
          type: object
          description: Range provided via Unix timestamp range (inclusive)
          properties:
            start:
              description: Start Unix Timestamp
              $ref: '#/components/schemas/timestamp'
            end:
              description: End Unix Timestamp
              $ref: '#/components/schemas/timestamp'

    timeRangeSelectorEpoch:
      type: object
      title: Epoch
      description: Range provided via epoch number
      properties:
        epoch:
          type: object
          description: Epoch range (inclusive)
          properties:
            start:
              description: Start Epoch 
              $ref: '#/components/schemas/epochParam'
            end:
              description: End Epoch
              $ref: '#/components/schemas/epochParam'

    timeRangeSelector:
      description: |
        Specify a time range using either Unix timestamps or epoch numbers.
      oneOf:
        - $ref: '#/components/schemas/timeRangeSelectorTime'
        - $ref: '#/components/schemas/timeRangeSelectorEpoch'
      

    validatorsSelector:
      description: |-
        One of the following fields is required to select validators:

        - deposit_address: The Ethereum wallet address used for the validator's deposit.
        - withdrawal: The validator's withdrawal credential or the Ethereum wallet address used for withdrawals.
        - validator_identifiers: One or more validator indices or public keys to filter by.
      oneOf:
        - $ref: '#/components/schemas/ValidatorsByDeposit'
        - $ref: '#/components/schemas/ValidatorsByWithdrawal'
        - $ref: '#/components/schemas/ValidatorsByIdentifiers'
          
    validatorSelector:
      description: |-
        One of the following fields is required to select validators:

        - deposit_address: The Ethereum wallet address used for the validator's deposit.
        - withdrawal: The validator's withdrawal credential or the Ethereum wallet address used for withdrawals.
        - validator_identifiers: One validator index or public key to filter by.
      oneOf:
        - $ref: '#/components/schemas/ValidatorsByDeposit'
        - $ref: '#/components/schemas/ValidatorsByWithdrawal'
        - $ref: '#/components/schemas/ValidatorsByIdentifier'
          
    EvaluationWindow:
      type: string
      enum:
        - 24h
        - 7d
        - 30d
        - 1y
        - all_time
      default: 30d
      description: The supported evaluation window to use for performance metrics.

    clQueues:
      type: object
      properties:
        execution_layer_queued:
          type: integer
          minimum: 0
          nullable: true
        execution_layer_processed:
          type: integer
          minimum: 0
          nullable: true
        consensus_layer_queued:
          type: integer
          minimum: 0
          nullable: true
          x-sortable: true
        consensus_layer_processed:
          type: integer
          minimum: 0
          nullable: true
          x-sortable: true

    Chain:
      type: string
      enum:
        - mainnet
        - hoodi
      default: mainnet
      description: The Ethereum chain to query.

    Cursor:
      type: string
      description: A cursor value for pagination.

    PageSize:
      type: integer
      minimum: 1
      maximum: 100
      default: 10

    timestamp:
      type: integer
      minimum: 0

    wei:
      type: string
      description: Amount in wei (1 ETH = 10^18 wei)
      pattern: ^(0|-?[1-9][0-9]*)$

    chainView:
      type: string
      enum:
        - latest
        - finalized
      description: |
        - "latest": Refers to the most recent block, which may be subject to reorganization.
        - "finalized": Refers to the latest block that has been finalized and is not subject to change.
    
    chainViewFinalized:
      type: string
      enum:
        - finalized

    validator:
      type: object
      properties:
        index:
          allOf:
            - $ref: '#/components/schemas/validatorIndex'
          nullable: true
        public_key:
          $ref: '#/components/schemas/validatorPublicKey'

    validatorPublicKey:
      type: string
      description: Public key of a validator
      pattern: ^0x[a-fA-F0-9]{96}$

    validatorIndex:
      description: Validator Index
      type: integer
      minimum: 0

    count:
      type: integer
      minimum: 0

    ValidatorsByDeposit:
      type: object
      title: Deposit
      properties:
        deposit_address:
          $ref: '#/components/schemas/ExecutionLayerAddress'
      required: [deposit_address]

    ValidatorsByWithdrawal:
      type: object
      title: Withdrawal
      properties:
        withdrawal:
          description: |
            Specifies the withdrawal credential used to select validators.
            - For withdrawal credentials with prefix "0x01" or "0x02", you may provide either the full 32-byte withdrawal credential or, for convenience, just the execution address (20-byte hex string, standard Ethereum address).
            - For withdrawal credentials with prefix "0x00" (BLS withdrawal credentials), only the full 32-byte withdrawal credential is accepted, as there is no associated execution address.
          oneOf:
            - $ref: '#/components/schemas/ExecutionLayerAddress'
              title: Execution Address
            - $ref: '#/components/schemas/withdrawalCredentialPrimitive'
              title: Full Withdrawal Credential
      required: [withdrawal]


    ValidatorsByIdentifiers: # array with multiple elements
      type: object
      title: Indexes/Public Keys
      properties:
        validator_identifiers:
          $ref: '#/components/schemas/validatorIndexPublicKeys'
      required: [validator_identifiers]

    ValidatorsByIdentifier: # array with one element (for now)
      type: object
      title: Indexes/Public Keys
      properties:
        validator_identifiers:
          $ref: '#/components/schemas/validatorIndexPublicKeysLimited'
      required: [validator_identifiers]

    epochParam:
      oneOf:
        - $ref: '#/components/schemas/Epoch'
        - type: string
          enum:
            - latest
            - finalized
      default: latest

    epochParamNullable:
      oneOf:
        - $ref: '#/components/schemas/Epoch'
        - type: string
          enum:
            - latest
            - finalized
      default: null
      description: The epoch filter is optional. If not specified, results will include all epochs.
      nullable: true

    slotParam:
      oneOf:
        - $ref: '#/components/schemas/Slot'
        - type: string
          enum:
            - latest
            - finalized
      default: latest

    transactionHash:
      type: string
      pattern: ^0x[a-fA-F0-9]{64}$

    ExecutionLayerAddress:
      type: string
      pattern: ^0x[a-fA-F0-9]{40}$
      description: A standard Ethereum address (20-byte hex string with 0x prefix).

    ConsensusLayerBlockRoot:
      type: string
      pattern: ^0x[a-fA-F0-9]{64}$
      description: A 32-byte block root represented as a hex string with 0x prefix.

    ExecutionLayerBlockHash:
      type: string
      pattern: ^0x[a-fA-F0-9]{64}$ 

    ExecutionLayerAddressDetails:
      type: object
      properties:
        address:
          $ref: '#/components/schemas/ExecutionLayerAddress'
        is_contract:
          type: boolean
        ens:
          type: string
          nullable: true

    ValidatorDutyType:
      type: string
      enum:
        - proposal
        - attestation
        - sync_committee

    EOAPublicKey:
      description: The public key of an externally owned account (EOA, ie. user-controlled)
      type: string
      pattern: ^0x[a-fA-F0-9]{96}$
      
    validatorIndexPublicKey:
      oneOf:
        - $ref: '#/components/schemas/validatorIndex'
        - $ref: '#/components/schemas/validatorPublicKey'
          
    validatorIndexPublicKeys:
      description: An array containing either validator indices or public keys. Index and public key can be mixed in the same array.
      type: array
      items:
        $ref : '#/components/schemas/validatorIndexPublicKey'
      minItems: 1
      maxItems: 100

    validatorIndexPublicKeysLimited:
      description: |
        An array containing either a validator index or a public key. 

        Only a single entry is allowed in this array at this time; support for multiple entries may be added in the future.
      type: array
      items:
        $ref : '#/components/schemas/validatorIndexPublicKey'
      minItems: 1
      maxItems: 1

    withdrawalCredentialType:
      type: string
      description: | 
        Specifies whether the withdrawal credential is a BLS withdrawal credential or an execution address withdrawal credential.
      enum:
        - bls
        - execution_address

    withdrawalCredentialPrimitive:
      type: string
      pattern: ^0x[a-fA-F0-9]{64}$
      description: A full 32-byte withdrawal credential represented as a hex string with 0x prefix.

    withdrawalCredentialPrefix:
      type: string
      enum:
        - "0x00"
        - "0x01"
        - "0x02"
      description: |
        Hexadecimal prefix indicating the type of withdrawal credential:
        - "0x00": BLS withdrawal credential
        - "0x01": Execution address withdrawal credential
        - "0x02": Execution address withdrawal credential with consolidation support (Electra Fork)

        Credentials can be upgraded in one direction only:
        - From "0x00" (BLS) to "0x01" (execution address)
        - From "0x01" to "0x02" (consolidation-enabled execution address)
        Downgrades are not permitted.

    withdrawalCredential:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/withdrawalCredentialType'
        prefix:
          $ref: '#/components/schemas/withdrawalCredentialPrefix'
        credential:
          $ref: '#/components/schemas/withdrawalCredentialPrimitive'
        address:
          $ref: '#/components/schemas/ExecutionLayerAddress'
          nullable: true
          description: Present only if type is execution_address


    ValidatorBalancesBase:
      type: object
      properties:
        current:
          description: |
            The validator's balance at a given state.
            This includes all rewards and penalties accrued up to that point, excluding any withdrawn amounts.
          $ref: '#/components/schemas/wei'
        effective:
          description: |
            The effective balance is the amount used to calculate rewards and penalties for the validator on the consensus layer. 
            
            It relates to the current balance to some extent, but is not the same. 
            Unlike the current balance, the effective balance is updated less frequently, only in whole ETH increments, and is subject to a maximum cap: 
            32 ETH for withdrawal credential prefixes "0x00" or "0x01", and 2048 ETH for prefix "0x02".
          $ref: '#/components/schemas/wei'

    validatorBalancesHead:
      allOf:
        - $ref: '#/components/schemas/ValidatorBalancesBase'
        - type: object
          description: |
            The balances object provides detailed information about a validator's balances at the head of the chain.

            Balances are measured immediately before the first slot of the head chain.
            For example, a balance reported for epoch 10 reflects the state after the final slot of epoch 9 and before the first slot of epoch 10.

            For more details about balances, see: https://eth2book.info/latest/part2/incentives/balances/

    validatorBalance:
      allOf:
        - $ref: '#/components/schemas/ValidatorBalancesBase'
        - type: object
          description: |
            The balances object provides detailed information about a validator's balances at a specific epoch.

            Balances are measured immediately before the first slot of the requested epoch.
            For example, a balance reported for epoch 10 reflects the state after the final slot of epoch 9 and before the first slot of epoch 10.

            For more details about balances, see: https://eth2book.info/latest/part2/incentives/balances/

        # deposited: # will be added later
        #   description: The amount of ETH that was actively deposited to the validator by the owner, not including any accumulated rewards or penalties.
        #   $ref: '#/components/schemas/wei'

    ConsensusLayerEventStatus:
      type: string
