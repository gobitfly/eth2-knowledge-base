          $ref: '#/components/schemas/clQueues'
        finality:
          $ref: '#/components/schemas/FinalityParams'

    DutyStatus:
      type: string
      enum:
        - success
        - missed
        - orphaned
        - scheduled
        
    SyncDutyStatus:
      type: string
      enum:
        - success
        - missed
        - scheduled
        
    Epoch:
      type: integer
      minimum: 0

    Slot: 
      type: integer
      minimum: 0
      description: Slot by number.

    Block:
      type: integer
      minimum: 0

    graffiti:
      type: string
      nullable: true
      pattern: ^[A-Za-z0-9+/]{0,44}={0,2}$
      description: |
        Validators can include an optional message called "graffiti" in proposed blocks.
        The graffiti is limited to 32 bytes and is returned as a base64-encoded string here.
        If no graffiti was included, this field will be null.

    SyncCommitteePeriod:
      description: |
        The sync committee period number.

        Each sync committee period spans 256 epochs (approximately 27.3 hours with 12-second epochs).
        The first sync committee period (period 290 on Ethereum Mainnet) started at the Altair hard fork on Oct 27, 2021, 10:56:23am UTC (epoch 74240).
      type: integer
      minimum: 0

    ResultRange:
      type: object
      description: The range of data covered by the results, specified in both epochs and Unix timestamps.
      properties:
        slot:
          $ref: '#/components/schemas/SlotRange'
        epoch:
          $ref: '#/components/schemas/EpochRange'
        timestamp: 
          $ref: '#/components/schemas/TimeRange'
    SlotRange:
      type: object
      properties:
        start:
          $ref: '#/components/schemas/Slot'
        end:
          $ref: '#/components/schemas/Slot'
    EpochRange:
      type: object
      properties:
