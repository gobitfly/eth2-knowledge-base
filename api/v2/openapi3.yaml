      summary: 👀 Validators
      description: |
        Returns the validators in the sync committee for a particular sync period.
      parameters:
        - $ref: '#/components/parameters/syncCommitteePeriodPath'
      requestBody:
        $ref : "#/components/requestBodies/ChainOptionalValidator"
      responses:
        "200":
          $ref: '#/components/responses/SyncCommitteeValidators'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
        "429":
