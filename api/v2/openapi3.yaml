          slot:
            $ref: '#/components/schemas/Slot'
          success:
            type: boolean

    ValidatorSyncCommitteeDutyCount:
      type: object
      properties:
        successful:
          type: integer
          description: Number of times the validator successfully participated in the sync committee.
          minimum: 0
        assigned:
          type: integer
          description: Number of times the validator was assigned to participate in the sync committee.
          minimum: 0
        missed:
          type: integer
          description: Number of times the validator missed participation in the sync committee.
          minimum: 0

    PerformanceDuties.Duties:
      type: object
      properties:
        attestation:
          type: object
          properties:
            included:
              type: integer
              description: |
                  Number of times the validator's attestation was included on-chain.

                  This count includes all attestations submitted by the validator, even if they were included too late to earn a reward (such late attestations are still considered "missed" for reward purposes).
                  "Included" reflects every attestation that made it on-chain, regardless of timeliness or eligibility for rewards.

                  This metric indicates whether your validator is actively submitting attestations to the network.
            assigned:
              type: integer
              description: |
                Number of times the validator was assigned an attestation duty.
                This represents the total opportunities to attest, regardless of whether the validator fulfilled the duty.
            correct_head:
              description: |
                Number of times the validator attested with the correct head block.
                Correct references are necessary to be rewarded by the chain. but incorrect references result in no reward or a penalty.
              type: integer
            correct_source:
              description: |
                Number of times the validator attested with the correct source block.
                Correct references are necessary to be rewarded by the chain. but incorrect references result in no reward or a penalty.
              type: integer
            correct_target:
              description: |
                Number of times the validator attested with the correct target block.
                Correct references are necessary to be rewarded by the chain. but incorrect references result in no reward or a penalty.
              type: integer
            valuable_correct_head:
              description: |
                Counts the number of correct head attestations that were included early enough to receive a reward.

                Attestations that were included too late to earn a reward (and are treated as missed for reward purposes) are not counted as valuable.
              type: integer
            valuable_correct_source:
              description: |
                Counts the number of correct source attestations that were included early enough to receive a reward.

                Attestations that were included too late to earn a reward (and are treated as missed for reward purposes) are not counted as valuable.
              type: integer
            valuable_correct_target:
              description: |
                Counts the number of correct target attestations that were included early enough to receive a reward.

                Attestations that were included too late to earn a reward (and are treated as missed for reward purposes) are not counted as valuable.
              type: integer
            avg_inclusion_delay:
              description: |
                Average inclusion delay measures how quickly a validator's attestations are included in the chain, expressed in slots. 
                Lower values indicate more timely inclusion and better performance.

                An ideal value of 0 means every attestation was included at the earliest possible opportunity—one slot after it was assigned to you.
              type: number
              format: float
              example: 1.2
              minimum: 0
              maximum: 63
            avg_inclusion_delay_excluding_missed_slots:
              description: |
                This is your average inclusion delay, excluding any missed blocks.

                - If avg_inclusion_delay_excluding_missed_slots is close to zero but avg_inclusion_delay is higher, this indicates that most of your attestations are included promptly, and any lost rewards are primarily due to missed blocks on the network (outside your control). 
                - If both values are large, it suggests your validator is experiencing delays in submitting attestations, likely due to issues with your validator's setup or connectivity.             
                  
                Note: avg_inclusion_delay is used for reward calculations. Therefore, an avg_inclusion_delay_excluding_missed_slots of zero does not mean there were no missed rewards.
                
                The optimal average inclusion delay is always less than or equal to your actual avg_inclusion_delay.
              type: number
              format: float
              example: 1.2
              minimum: 0
              maximum: 63
            missed:
              type: integer
        sync_committee:
          $ref: '#/components/schemas/ValidatorSyncCommitteeDutyCount'
        proposal:
          type: object
          properties:
            successful:
              type: integer
              description: Number of times the validator successfully proposed a block.
            assigned:
              type: integer
              description: Number of times the validator was assigned to propose a block.
            missed:
              type: integer
              description: Number of times the validator either missed a scheduled block proposal or had their proposed block orphaned
            included_slashings:
              type: integer
              description: |
                Number of slashing proofs included in blocks proposed by the validator.
                A slashing proof provides cryptographic evidence that one or more validators have committed a slashable offense, such as:
                  - double voting (submitting two conflicting attestations or proposals for the same target epoch)
                  - surround voting (submitting two attestations or proposals where one surrounds the other in terms of source and target epochs)

