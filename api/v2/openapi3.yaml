  /v2/ethereum/sync-committees/{period}: # low prio (needed for synergy to access validator sync committees)
    post:
      tags:
        - Sync Committee
      summary: 👀 Overview
      operationId: GetSyncCommitteeForPeriod
      x-mint:
        href: "/api-reference/ethereum/sync-committees/overview"
      description: Returns basic sync committee information for a particular sync period. Use this to determine the range of epochs a given sync period entails.
      requestBody:
        $ref : "#/components/requestBodies/JustChain"
      parameters:
        - $ref: '#/components/parameters/syncCommitteePeriodPath'
      responses:
        "200":
          $ref: '#/components/responses/SyncCommitteeOverview'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
        "429":
          $ref: '#/components/responses/RateLimitExceeded'
        default:
          $ref: '#/components/responses/DefaultError'
  
  /v2/ethereum/sync-committees/{period}/validators:
    post:
      tags:
        - Sync Committee
      operationId: GetSyncCommitteeValidatorsForPeriod
