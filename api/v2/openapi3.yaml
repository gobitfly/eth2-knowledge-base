          - $ref: '#/components/schemas/chainView'
          - $ref: '#/components/schemas/ConsensusLayerBlockRoot'
        default: latest

    slotNoUnjustified:
      name: slot
      in: path
      required: true
      schema:
        oneOf:
          - $ref: '#/components/schemas/Slot'
          - $ref: '#/components/schemas/chainViewFinalized'
          - $ref: '#/components/schemas/ConsensusLayerBlockRoot'
        default: finalized

    block:
      name: block
      in: path
      required: true
      schema:
        oneOf:
          - type: integer
            minimum: 0
          - $ref: '#/components/schemas/chainView'
          - $ref: '#/components/schemas/ExecutionLayerBlockHash'
        default: latest

